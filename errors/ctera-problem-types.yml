generated: '2026-07-18'
method: searched
source: https://www.ctera.com/help/portal/6.0/api/CTERA%20Portal%20APIs/CTERA_Portal_API_Developer_Guide2.html
format: http-status
envelope:
  style: http-status-plus-text
  note: >-
    The CTERA Portal RESTful API signals errors with standard HTTP status codes.
    400 and 500 responses carry descriptive error text in the response body. This
    is not RFC 9457 problem+json.
problems:
  - status: 200
    title: OK
    meaning: Success; results are in the response body.
  - status: 400
    title: Bad Request
    meaning: Malformed request; error text is provided in the response body.
    action: Fix the request syntax/parameters per the error text.
  - status: 401
    title: Unauthorized
    meaning: Authentication required. The client must support HTTP cookies.
    action: Log in via {BASE_URL}/login and reuse the session cookie.
  - status: 403
    title: Forbidden
    meaning: Insufficient or invalid credentials.
    action: Verify username/password and administrator privileges.
  - status: 404
    title: Not Found
    meaning: The requested object does not exist.
    action: Verify the object URI.
  - status: 500
    title: Internal Server Error
    meaning: Server error; a detailed description is provided in the response body.
    action: Inspect the response body; retry or contact CTERA support.

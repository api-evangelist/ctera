apis:
- name: CTERA Portal RESTful API
  description: >-
    RESTful management API for the CTERA Portal. Exposes a uniform object
    namespace (users, devices, folders, and more) where each object is addressed
    by a unique URI, using GET/PUT/POST/DELETE verbs. Authentication is
    session-cookie based via a form login (j_username/j_password); errors are
    conveyed with standard HTTP status codes.

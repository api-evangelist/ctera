aid: ctera
name: CTERA
description: >-
  CTERA operates the CTERA Intelligent Data Platform, a unified edge-to-cloud
  global file system and data fabric for managing unstructured file data across
  distributed enterprises. The platform combines secure file collaboration,
  cyber protection and ransomware defense, global file locking, enterprise
  search, data classification, and AI-readiness (InsightAI) over a single global
  namespace spanning edge, data center, and public cloud. CTERA is programmable
  through a RESTful Portal management API (uniform object namespace addressed by
  URIs), an official Apache-2.0 Python SDK (cterasdk), a CLI toolbox (ctools),
  and two official Model Context Protocol servers (mcp-ctera-core and
  mcp-ctera-edge) that give AI agents file-and-folder operations over the Portal
  and Edge Filer. CTERA was surfaced as a portfolio company of Bessemer Venture
  Partners.
